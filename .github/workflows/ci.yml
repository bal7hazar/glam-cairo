name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run every test target and benchmark module
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# A new push to a pull request cancels its superseded run; every push to main gets a group of its
# own commit (GitHub keeps one pending run per group), so each main commit keeps its full run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which jobs a pull request needs, from its changed paths (never from a label). Pushes to main
  # and manual runs run every job. A change of the toolchain row, or of a path that no row of
  # the table names, runs every job. Prose .md files trigger nothing, except the ones a script
  # checks: README.md and packages/glam/README.md (generated gas regions, gas_tables.py) and
  # docs/API_PARITY.md (api_parity.py --check). The test matrix and the bench modules come from
  # the `plan` job below (scripts/affected.py), which also selects everything for an unknown path.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      fmt_lint: ${{ steps.flags.outputs.fmt_lint }}
      golden: ${{ steps.flags.outputs.golden }}
      docs: ${{ steps.flags.outputs.docs }}
      consumer_cost: ${{ steps.flags.outputs.consumer_cost }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: some
        if: github.event_name == 'pull_request'
        with:
          filters: |
            toolchain:
              - '.tool-versions'
              - 'Scarb.toml'
              - 'Scarb.lock'
              - '.github/workflows/**'
            scripts:
              - 'scripts/**'
            gas:
              - 'gas/**'
            checked_docs:
              - 'README.md'
              - 'packages/glam/README.md'
              - 'docs/API_PARITY.md'
            golden_tests:
              - 'packages/glam/tests/golden_*.cairo'
            doc_sources:
              - 'packages/*/src/**'
              - 'packages/*/Scarb.toml'
            consumer:
              - 'packages/glam/src/**'
              - 'packages/glam/Scarb.toml'
              - 'packages/glam_core/src/**'
              - 'packages/glam_core/Scarb.toml'
              - 'packages/glam_int/src/**'
              - 'packages/glam_int/Scarb.toml'
              - 'packages/glam_swizzles/src/**'
              - 'packages/glam_swizzles/Scarb.toml'
              - 'packages/glam_int_swizzles/src/**'
              - 'packages/glam_int_swizzles/Scarb.toml'
              - 'consumer_cost.toml'
              - 'scripts/consumer_cost.py'
              - 'scripts/packages_table.py'
      # Filters that exclude prose .md (or select what no row names) need every pattern of a list
      # to hold: with the default quantifier, a list of negations matches almost every path.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: every
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: 'every'
          filters: |
            cairo:
              - 'packages/**'
              - '!**/*.md'
            codegen:
              - 'tools/codegen/**'
              - '!**/*.md'
            refgen:
              - 'tools/refgen/**'
              - '!**/*.md'
            unknown:
              - '**'
              - '!packages/**'
              - '!scripts/**'
              - '!gas/**'
              - '!tools/refgen/**'
              - '!tools/codegen/**'
              - '!docs/**'
              - '!**/*.md'
              - '!consumer_cost.toml'
              - '!.tool-versions'
              - '!Scarb.toml'
              - '!Scarb.lock'
              - '!.github/workflows/**'
      - name: Jobs to run
        id: flags
        env:
          EVENT: ${{ github.event_name }}
          TOOLCHAIN: ${{ steps.some.outputs.toolchain }}
          SCRIPTS: ${{ steps.some.outputs.scripts }}
          GAS: ${{ steps.some.outputs.gas }}
          CHECKED_DOCS: ${{ steps.some.outputs.checked_docs }}
          GOLDEN_TESTS: ${{ steps.some.outputs.golden_tests }}
          DOC_SOURCES: ${{ steps.some.outputs.doc_sources }}
          CONSUMER: ${{ steps.some.outputs.consumer }}
          CAIRO: ${{ steps.every.outputs.cairo }}
          CODEGEN: ${{ steps.every.outputs.codegen }}
          REFGEN: ${{ steps.every.outputs.refgen }}
          UNKNOWN: ${{ steps.every.outputs.unknown }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != "pull_request" ]]; then
            for job in fmt_lint golden docs consumer_cost; do
              echo "$job=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          # A filter output that is neither true nor false (a misspelt name) fails the job.
          for name in TOOLCHAIN SCRIPTS GAS CHECKED_DOCS GOLDEN_TESTS DOC_SOURCES CONSUMER CAIRO CODEGEN REFGEN UNKNOWN; do
            if [[ "${!name}" != "true" && "${!name}" != "false" ]]; then
              echo "::error::filter output $name is '${!name}', expected true or false"
              exit 1
            fi
          done
          any() {
            for name in "$@"; do
              if [[ "${!name}" == "true" ]]; then echo true; return; fi
            done
            echo false
          }
          echo "fmt_lint=$(any TOOLCHAIN UNKNOWN CAIRO CODEGEN SCRIPTS GAS CHECKED_DOCS)" >> "$GITHUB_OUTPUT"
          echo "golden=$(any TOOLCHAIN UNKNOWN REFGEN GOLDEN_TESTS)" >> "$GITHUB_OUTPUT"
          echo "docs=$(any TOOLCHAIN UNKNOWN DOC_SOURCES)" >> "$GITHUB_OUTPUT"
          echo "consumer_cost=$(any TOOLCHAIN UNKNOWN CONSUMER)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  plan:
    name: Plan affected checks
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.plan.outputs.all }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
      tests: ${{ steps.plan.outputs.tests }}
      benches: ${{ steps.plan.outputs.benches }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        name: Select targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          FORCE_FULL: ${{ inputs.full }}
        run: |
          if [[ "$EVENT_NAME" == "push" || "$FORCE_FULL" == "true" ]]; then
            plan=$(python3 scripts/affected.py --paths packages/glam/Scarb.toml)
          else
            plan=$(python3 scripts/affected.py "$PR_BASE")
          fi
          echo "$plan"
          PLAN="$plan" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          plan = json.loads(os.environ["PLAN"])
          print(f"all={str(plan['all']).lower()}")
          print(f"docs_only={str(plan['docs_only']).lower()}")
          print("tests=" + json.dumps(plan["tests"], separators=(",", ":")))
          print("benches=" + json.dumps(plan["benches"], separators=(",", ":")))
          PY

  fmt-lint:
    name: Format, lint, build, and freshness
    needs: [plan, changes]
    if: ${{ needs.changes.outputs.fmt_lint == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Wandalen/wretry.action@71a909ebf09f3ffdc6f42a17bd54ecb43481da49 # v3.8.0_js_action
        with:
          action: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd
          attempt_limit: 3
          attempt_delay: 10000
      - run: scarb fmt --check --workspace
      - run: python3 scripts/affected.py --check
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - if: ${{ needs.plan.outputs.docs_only != 'true' }}
        run: scarb lint --workspace --test --deny-warnings
      - if: ${{ needs.plan.outputs.docs_only != 'true' }}
        run: scarb build --workspace
      - name: Check generated Cairo sources and tests
        if: ${{ needs.plan.outputs.docs_only != 'true' }}
        run: |
          python3 tools/codegen/fvec.py --check
          python3 tools/codegen/fmat.py --check
          python3 tools/codegen/intvec.py --check
          python3 tools/codegen/swizzles.py --check
      - run: python3 scripts/api_parity.py --check
      - run: python3 scripts/gas_tables.py --check
      - run: python3 scripts/panic_coverage.py --check

  test:
    name: Test ${{ matrix.target }}
    needs: plan
    if: ${{ needs.plan.outputs.tests != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.tests) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Wandalen/wretry.action@71a909ebf09f3ffdc6f42a17bd54ecb43481da49 # v3.8.0_js_action
        with:
          action: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd
          attempt_limit: 3
          attempt_delay: 10000
      - id: snfoundry_1
        uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
        continue-on-error: true
      - run: sleep 20
        if: steps.snfoundry_1.outcome == 'failure'
      - id: snfoundry_2
        uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
        if: steps.snfoundry_1.outcome == 'failure'
        continue-on-error: true
      - run: sleep 20
        if: steps.snfoundry_1.outcome == 'failure' && steps.snfoundry_2.outcome == 'failure'
      - uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
        if: steps.snfoundry_1.outcome == 'failure' && steps.snfoundry_2.outcome == 'failure'
      # The filter executes one explicit family target; the six-target manifest bounds compile cost.
      - name: Test
        run: /usr/bin/time -v snforge test "${{ matrix.target }}" -p glam --fuzzer-runs 32 --fuzzer-seed 1

  bench:
    name: Benches and gas snapshots
    needs: plan
    if: ${{ needs.plan.outputs.benches != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Wandalen/wretry.action@71a909ebf09f3ffdc6f42a17bd54ecb43481da49 # v3.8.0_js_action
        with:
          action: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd
          attempt_limit: 3
          attempt_delay: 10000
      - id: snfoundry_1
        uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
        continue-on-error: true
      - run: sleep 20
        if: steps.snfoundry_1.outcome == 'failure'
      - id: snfoundry_2
        uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
        if: steps.snfoundry_1.outcome == 'failure'
        continue-on-error: true
      - run: sleep 20
        if: steps.snfoundry_1.outcome == 'failure' && steps.snfoundry_2.outcome == 'failure'
      - uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
        if: steps.snfoundry_1.outcome == 'failure' && steps.snfoundry_2.outcome == 'failure'
      - name: Check gas snapshots
        env:
          ALL_BENCHES: ${{ needs.plan.outputs.all }}
          BENCHES: ${{ needs.plan.outputs.benches }}
        run: |
          set -o pipefail
          if [[ "$ALL_BENCHES" == "true" ]]; then
            python3 scripts/bench.py check | tee gas_report.md
          else
            : > gas_report.md
            while IFS= read -r module; do
              python3 scripts/bench.py check "bench_$module" | tee -a gas_report.md
            done < <(python3 -c 'import json, os; print(*json.loads(os.environ["BENCHES"]), sep="\n")')
          fi
      - name: Check bytecode size
        run: |
          set -o pipefail
          python3 scripts/bytecode_size.py check | tee -a gas_report.md
      - name: Publish gas report
        if: always()
        run: cat gas_report.md >> "$GITHUB_STEP_SUMMARY"

  golden:
    name: Golden vectors up to date
    needs: changes
    if: ${{ needs.changes.outputs.golden == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            tools/refgen/target
          key: refgen-${{ runner.os }}-${{ hashFiles('tools/refgen/Cargo.lock') }}
      - name: Generator unit tests
        run: cargo test --locked --manifest-path tools/refgen/Cargo.toml
      - name: Check golden vectors
        run: cargo run --locked --manifest-path tools/refgen/Cargo.toml -- check

  docs:
    name: Docs build
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Wandalen/wretry.action@71a909ebf09f3ffdc6f42a17bd54ecb43481da49 # v3.8.0_js_action
        with:
          action: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd
          attempt_limit: 3
          attempt_delay: 10000
      - run: scarb doc --workspace --disable-remote-linking

  # Package granularity rule (docs/briefs/PK-G-package-size.md): the five published crates
  # (`glam_core`, `glam_int`, `glam_swizzles`, `glam_int_swizzles`, `glam`) and the closures of
  # consumer_cost.toml against the size gates (library lines, cold-build time and memory an empty
  # consumer adds), scripts/consumer_cost.py. Enforcing: any failing verdict fails the job.
  consumer-cost:
    name: Consumer cost
    needs: changes
    if: ${{ needs.changes.outputs.consumer_cost == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Wandalen/wretry.action@71a909ebf09f3ffdc6f42a17bd54ecb43481da49 # v3.8.0_js_action
        with:
          action: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd
          attempt_limit: 3
          attempt_delay: 10000
      - name: Consumer cost script (self-test, no build)
        run: |
          python3 scripts/consumer_cost.py --self-test
          python3 scripts/packages_table.py --self-test
      - name: Measure the published crates (cold builds, one after the other, median of 3)
        run: |
          set -o pipefail
          status=0
          python3 scripts/consumer_cost.py --repeat 3 --modules --json consumer_cost.json | tee consumer_cost.md || status=$?
          { echo "### Consumer cost"; echo; cat consumer_cost.md; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Package table (docs/PACKAGES.md format, artifact and job summary)
        if: always() && hashFiles('consumer_cost.json') != ''
        run: |
          python3 scripts/packages_table.py consumer_cost.json \
            --runner "ubuntu-latest, $(nproc) vCPU / $(free -g | awk '/Mem:/ {print $2}') GB" \
            --output PACKAGES.md
          cat PACKAGES.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: consumer-cost
          path: |
            consumer_cost.json
            consumer_cost.md
            PACKAGES.md
          if-no-files-found: warn
          retention-days: 30

  all-checks:
    name: All checks passed
    if: always()
    needs: [changes, plan, fmt-lint, test, bench, golden, docs, consumer-cost]
    runs-on: ubuntu-latest
    env:
      EVENT: ${{ github.event_name }}
      CHANGES_RESULT: ${{ needs.changes.result }}
      PLAN_RESULT: ${{ needs.plan.result }}
      PLAN_TESTS: ${{ needs.plan.outputs.tests }}
      PLAN_BENCHES: ${{ needs.plan.outputs.benches }}
      FLAG_FMT_LINT: ${{ needs.changes.outputs.fmt_lint }}
      RESULT_FMT_LINT: ${{ needs.fmt-lint.result }}
      RESULT_TEST: ${{ needs.test.result }}
      RESULT_BENCH: ${{ needs.bench.result }}
      FLAG_GOLDEN: ${{ needs.changes.outputs.golden }}
      RESULT_GOLDEN: ${{ needs.golden.result }}
      FLAG_DOCS: ${{ needs.changes.outputs.docs }}
      RESULT_DOCS: ${{ needs.docs.result }}
      FLAG_CONSUMER_COST: ${{ needs.changes.outputs.consumer_cost }}
      RESULT_CONSUMER_COST: ${{ needs.consumer-cost.result }}
    steps:
      # A job passes when it succeeded, or when the paths rule skipped it. On a pull request its
      # result is compared with the flag that gates it: flag true needs success, flag false needs
      # skipped (a skip for another reason, such as a failed dependency, fails), any other flag
      # value (a misspelt output) fails. The test and bench flags are "the plan selected targets"
      # (an output other than the empty list `[]`). Elsewhere every job must have succeeded.
      - run: |
          fail=0
          for job in CHANGES PLAN; do
            result="${job}_RESULT"
            if [[ "${!result}" != "success" ]]; then
              echo "::error::${job,,}: ${!result}"
              fail=1
            fi
          done
          check() {
            local job=$1 flag=$2 result=$3 want
            if [[ "$EVENT" != "pull_request" || "$flag" == "true" ]]; then
              want=success
            elif [[ "$flag" == "false" ]]; then
              want=skipped
            else
              echo "::error::$job: gate flag is '$flag', expected true or false"
              fail=1
              return
            fi
            if [[ "$result" != "$want" ]]; then
              echo "::error::$job: $result (flag '$flag', expected $want)"
              fail=1
            fi
          }
          selected() {
            if [[ -z "$1" ]]; then echo missing; elif [[ "$1" == "[]" ]]; then echo false; else echo true; fi
          }
          check fmt-lint "$FLAG_FMT_LINT" "$RESULT_FMT_LINT"
          check test "$(selected "$PLAN_TESTS")" "$RESULT_TEST"
          check bench "$(selected "$PLAN_BENCHES")" "$RESULT_BENCH"
          check golden "$FLAG_GOLDEN" "$RESULT_GOLDEN"
          check docs "$FLAG_DOCS" "$RESULT_DOCS"
          check consumer-cost "$FLAG_CONSUMER_COST" "$RESULT_CONSUMER_COST"
          exit "$fail"
