name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run every test target and benchmark module
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan affected checks
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.plan.outputs.all }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
      tests: ${{ steps.plan.outputs.tests }}
      benches: ${{ steps.plan.outputs.benches }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        name: Select targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          FORCE_FULL: ${{ inputs.full }}
        run: |
          if [[ "$EVENT_NAME" == "push" || "$FORCE_FULL" == "true" ]]; then
            plan=$(python3 scripts/affected.py --paths packages/glam/Scarb.toml)
          else
            plan=$(python3 scripts/affected.py "$PR_BASE")
          fi
          echo "$plan"
          PLAN="$plan" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          plan = json.loads(os.environ["PLAN"])
          print(f"all={str(plan['all']).lower()}")
          print(f"docs_only={str(plan['docs_only']).lower()}")
          print("tests=" + json.dumps(plan["tests"], separators=(",", ":")))
          print("benches=" + json.dumps(plan["benches"], separators=(",", ":")))
          PY

  fmt-lint:
    name: Format, lint, build, and freshness
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - run: scarb fmt --check --workspace
      - run: python3 scripts/affected.py --check
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - if: ${{ needs.plan.outputs.docs_only != 'true' }}
        run: scarb lint --workspace --test --deny-warnings
      - if: ${{ needs.plan.outputs.docs_only != 'true' }}
        run: scarb build --workspace
      - name: Check generated Cairo sources and tests
        if: ${{ needs.plan.outputs.docs_only != 'true' }}
        run: |
          python3 tools/codegen/fvec.py --check
          python3 tools/codegen/fmat.py --check
          python3 tools/codegen/intvec.py --check
          python3 tools/codegen/swizzles.py --check
      - run: python3 scripts/api_parity.py --check
      - run: python3 scripts/gas_tables.py --check
      - run: python3 scripts/panic_coverage.py --check

  test:
    name: Test ${{ matrix.target }}
    needs: plan
    if: ${{ needs.plan.outputs.tests != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.tests) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
      # Each filter names one explicit integration-test target, so this job compiles only its shard.
      - name: Test
        run: /usr/bin/time -v snforge test "${{ matrix.target }}" -p glam --fuzzer-runs 32 --fuzzer-seed 1

  bench:
    name: Benches and gas snapshots
    needs: plan
    if: ${{ needs.plan.outputs.benches != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
      - name: Check gas snapshots
        env:
          ALL_BENCHES: ${{ needs.plan.outputs.all }}
          BENCHES: ${{ needs.plan.outputs.benches }}
        run: |
          set -o pipefail
          if [[ "$ALL_BENCHES" == "true" ]]; then
            python3 scripts/bench.py check | tee gas_report.md
          else
            : > gas_report.md
            while IFS= read -r module; do
              python3 scripts/bench.py check "bench_$module" | tee -a gas_report.md
            done < <(python3 -c 'import json, os; print(*json.loads(os.environ["BENCHES"]), sep="\n")')
          fi
      - name: Check bytecode size
        run: |
          set -o pipefail
          python3 scripts/bytecode_size.py check | tee -a gas_report.md
      - name: Publish gas report
        if: always()
        run: cat gas_report.md >> "$GITHUB_STEP_SUMMARY"

  golden:
    name: Golden vectors up to date
    needs: plan
    if: ${{ needs.plan.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            tools/refgen/target
          key: refgen-${{ runner.os }}-${{ hashFiles('tools/refgen/Cargo.lock') }}
      - name: Generator unit tests
        run: cargo test --locked --manifest-path tools/refgen/Cargo.toml
      - name: Check golden vectors
        run: cargo run --locked --manifest-path tools/refgen/Cargo.toml -- check

  docs:
    name: Docs build
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - run: scarb doc --workspace --disable-remote-linking

  all-checks:
    name: All checks passed
    if: always()
    needs: [plan, fmt-lint, test, bench, golden, docs]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || \
             [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
