name: PK-G glam cut measurements (scratch, never merged)

on:
  push:
    branches: ['scratch/**']

permissions:
  contents: read

jobs:
  measure:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [paired]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - name: Paired measurement of A (c3) and B (vB), 15 interleaved cold builds per consumer
        run: |
          set -o pipefail
          python3 scratch/make.py packages/glam/src "$RUNNER_TEMP/wA" c3
          python3 scratch/make_vb.py packages/glam/src "$RUNNER_TEMP/wB"
          echo "runner: $(nproc) cores" | tee out.md
          python3 scratch/paired.py "$RUNNER_TEMP/wA" "$RUNNER_TEMP/wB" 15 | tee -a out.md
          { echo "### paired"; cat out.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cost-${{ matrix.variant }}
          path: |
            out.md
            paired.json
          if-no-files-found: warn
