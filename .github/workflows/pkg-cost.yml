name: PK-G glam cut measurements (scratch, never merged)

on:
  push:
    branches: ['scratch/**']

permissions:
  contents: read

jobs:
  measure:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [today, c3, vB]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - name: Measure (5 cold builds per consumer, median)
        run: |
          set -o pipefail
          echo "runner: $(nproc) cores, $(free -g | awk '/Mem/{print $2}') GB" | tee out.md
          if [[ "${{ matrix.variant }}" == today ]]; then
            python3 scripts/consumer_cost.py --package glam --report-only --repeat 5 --modules | tee -a out.md
          else
            if [[ "${{ matrix.variant }}" == vB ]]; then
              python3 scratch/make_vb.py packages/glam/src "$RUNNER_TEMP/w"
            else
              python3 scratch/make.py packages/glam/src "$RUNNER_TEMP/w" ${{ matrix.variant }}
            fi
            python3 scratch/cfg.py ${{ matrix.variant }} "$RUNNER_TEMP/w"
            cp scripts/consumer_cost.py "$RUNNER_TEMP/w/"
            (cd "$RUNNER_TEMP/w" && python3 consumer_cost.py --report-only --repeat 5 --json "$GITHUB_WORKSPACE/res.json" --modules) | tee -a out.md
          fi
          { echo "### ${{ matrix.variant }}"; cat out.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cost-${{ matrix.variant }}
          path: |
            out.md
            res.json
          if-no-files-found: warn
