# Gates of scripts/consumer_cost.py (copied unchanged from nalgebra-cairo 7177cf3; see the docstring
# at the top of that script). The values are the defaults of the package granularity rule: a
# published crate has at most 40,000 library lines, and its MARGINAL cost (an empty consumer of it
# minus an empty consumer of its direct dependencies together) is at most 5 s / 1 GB; a typical
# closure adds at most 15 s / 3 GB to the no-dependency cold build.
# Top-level key (before any table). The facade `glam` only re-exports the four sub-crates: it is judged on the closure budget only
# (gate 3: its own consumer against `closure_seconds` / `closure_gb`), not on lines or marginal cost.
facades = ["glam"]

[gates]
max_lines = 40000
max_seconds = 5
max_gb = 1
closure_seconds = 15
closure_gb = 3

# The published crates are the workspace packages without `publish = false`: `glam_core`,
# `glam_int`, `glam_swizzles`, `glam_int_swizzles` and the facade `glam` (docs/audits/
# PK-G-glam-cut-plan.md, section 9). Each is measured alone (lines, time, memory), and the
# closures below are the profiles of a consumer that pulls in several of them but not the facade.
# `glam_core` alone is the core-only profile; `glam` is the everything profile.
[closures]
core_swizzles = ["glam_core", "glam_swizzles"]
core_int = ["glam_core", "glam_int"]
core_int_swizzles = ["glam_core", "glam_int_swizzles"]
